spring:
  application:
    name: demo
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    # 本地 MySQL 连接，请改成你自己的账号密码
    url: jdbc:mysql://localhost:3306/wiki?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 开发期：MySQL 未启动时也允许应用启动（首次真正查库时才连接）。连上数据库后可删掉此行。
      initialization-fail-timeout: -1
  data:
    redis:
      host: 192.168.30.128
      port: 6379
      password: 123456
      database: 0

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo.entity
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8088

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ebook:
  # 封面文件保存目录（前端静态目录）与访问前缀
  cover-dir: D:\work\vue\public\static\image\cover
  cover-url-prefix: /static/image/cover

task:
  # 电子书统计聚合：每 10 分钟
  ebook-aggregate-cron: "0 */10 * * * ?"
  # 每日快照：每天 00:30
  snapshot-cron: "0 30 0 * * ?"
